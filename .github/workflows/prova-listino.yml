name: Prova listino Cardmarket (temporaneo)
on:
  push:
    branches: [main]
    paths: [".github/workflows/prova-listino.yml"]
permissions:
  contents: read
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Scarica e controlla
        shell: python
        run: |
          import json, urllib.request, gzip, collections
          H = {"User-Agent": "CardmarketPriceArchive/1.0 (GitHub Actions)", "Accept": "application/json"}
          def get(u):
              r = urllib.request.urlopen(urllib.request.Request(u, headers=H), timeout=300)
              return r.read()
          pg = json.loads(get("https://downloads.s3.cardmarket.com/productCatalog/priceGuide/price_guide_1.json"))
          items = pg["priceGuides"]; by = {it["idProduct"]: it for it in items}
          print("createdAt", pg["createdAt"], "prodotti", len(items))
          def dist(k):
              v = [it.get(k) for it in items]
              return {"null": sum(x is None for x in v), "zero": sum(x == 0 for x in v), ">0": sum(bool(x) for x in v)}
          for k in ["avg1", "avg7", "avg30", "avg1-foil", "avg7-foil", "trend", "low"]:
              print(k, dist(k))
          print("categorie", collections.Counter(it.get("idCategory") for it in items).most_common(8))
          bl = json.loads(get("https://api.scryfall.com/bulk-data"))
          item = next(i for i in bl["data"] if i["type"] == "default_cards")
          url = item.get("jsonl_download_uri") or item["download_uri"]
          raw = get(url)
          if url.endswith(".gz"): raw = gzip.decompress(raw)
          txt = raw.decode()
          cards = json.loads(txt) if txt.lstrip().startswith("[") else [json.loads(l) for l in txt.splitlines() if l.strip()]
          paper = [c for c in cards if "paper" in (c.get("games") or []) and ((c.get("prices") or {}).get("eur") or (c.get("prices") or {}).get("eur_foil"))]
          big = [c for c in paper if float((c["prices"].get("eur") or 0)) >= 1 or float((c["prices"].get("eur_foil") or 0)) >= 1]
          withid = [c for c in big if c.get("cardmarket_id")]
          match = [c for c in withid if c["cardmarket_id"] in by]
          print(f"Scryfall >=1 euro: {len(big)}, con cardmarket_id: {len(withid)}, nel listino: {len(match)}")
          ids = collections.Counter(c["cardmarket_id"] for c in withid)
          print("cardmarket_id condivisi da piu' carte:", sum(1 for v in ids.values() if v > 1))
          same = sum(1 for c in match if c["prices"].get("eur") and abs(float(c["prices"]["eur"]) - (by[c["cardmarket_id"]].get("trend") or -1)) < 0.011)
          print("trend Scryfall == listino:", same, "su", sum(1 for c in match if c["prices"].get("eur")))
          # carte care senza vendite recenti
          z = [c for c in match if c["prices"].get("eur") and float(c["prices"]["eur"]) >= 20]
          print("carte >=20 euro:", len(z), "avg1=0:", sum(1 for c in z if not by[c["cardmarket_id"]].get("avg1")), "avg7=0:", sum(1 for c in z if not by[c["cardmarket_id"]].get("avg7")), "avg30=0:", sum(1 for c in z if not by[c["cardmarket_id"]].get("avg30")))
          for name, st in [("Taiga", "lea"), ("Sol Ring", "lea"), ("Rhystic Study", "pcy"), ("Lightning Bolt", "m10"), ("The One Ring", "ltr")]:
              for c in paper:
                  if c["name"] == name and c["set"] == st:
                      print(name, st, c.get("cardmarket_id"), c["prices"].get("eur"), c["prices"].get("eur_foil"), json.dumps(by.get(c.get("cardmarket_id"))))
                      break
