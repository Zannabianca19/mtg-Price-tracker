name: Prova CardTrader (temporaneo)
on:
  push:
    branches: [main]
    paths: [".github/workflows/prova-cardtrader.yml"]
permissions:
  contents: read
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Offerte EX+ su alcune espansioni
        shell: python
        env:
          CT: ${{ secrets.CARDTRADER_TOKEN }}
        run: |
          import json, os, time, statistics, collections, urllib.request, urllib.error
          tok = os.environ.get("CT", "").strip()
          print("token presente:", bool(tok), "lunghezza:", len(tok))
          H = {"Authorization": "Bearer " + tok, "Accept": "application/json", "User-Agent": "mtg-price-tracker (daily archive test)"}
          def get(path):
              req = urllib.request.Request("https://api.cardtrader.com/api/v2" + path, headers=H)
              try:
                  with urllib.request.urlopen(req, timeout=120) as r:
                      return json.loads(r.read())
              except urllib.error.HTTPError as e:
                  print("ERRORE", path, e.code, e.read()[:300]); raise
          info = get("/info"); print("info: chiavi", list(info))
          games = get("/games"); gl = games.get("array", games) if isinstance(games, dict) else games
          print("giochi:", [(g.get("id"), g.get("display_name") or g.get("name")) for g in gl])
          exps = get("/expansions"); exps = exps.get("array", exps) if isinstance(exps, dict) else exps
          mtg = [e for e in exps if e.get("game_id") == 1]
          print("espansioni Magic:", len(mtg), "esempio:", mtg[:2])
          bycode = {(e.get("code") or "").lower(): e for e in mtg}
          market = json.loads(urllib.request.urlopen("https://zannabianca19.github.io/mtg-Price-tracker/data/market.json", timeout=120).read())
          cm = {r[0]: r for r in market["cards"]}   # scryfall id -> riga (6 = tendenza normale, 10 = foil, centesimi)
          EXP = ["Mint", "Near Mint", "Slightly Played"]
          def cents(p):
              v = p.get("price_cents")
              if v is None: v = (p.get("price") or {}).get("cents")
              return v
          def cur(p):
              return p.get("price_currency") or (p.get("price") or {}).get("currency")
          first = True
          for code in ["lea", "2xm", "mh3", "cmm", "ltr", "blb"]:
              e = bycode.get(code)
              if not e: print("\n==", code, "non trovata"); continue
              bps = get(f"/blueprints/export?expansion_id={e['id']}"); time.sleep(0.3)
              sid = {b["id"]: b.get("scryfall_id") for b in bps}
              names = {b["id"]: b.get("name") for b in bps}
              prods = get(f"/marketplace/products?expansion_id={e['id']}"); time.sleep(1.2)
              conds, langs, curr = collections.Counter(), collections.Counter(), collections.Counter()
              rows = []
              for bid, lst in prods.items():
                  bid = int(bid)
                  if first and lst:
                      p = dict(lst[0]); p.pop("user", None); p.pop("uploaded_images", None); p.pop("description", None)
                      print("esempio offerta:", json.dumps({k: v for k, v in p.items() if k not in ("properties_hash", "expansion")})[:700]); first = False
                  for p in lst:
                      ph = p.get("properties_hash") or {}
                      conds[ph.get("condition")] += 1; langs[ph.get("mtg_language")] += 1; curr[cur(p)] += 1
                  for foil in (False, True):
                      ex = sorted(cents(p) for p in lst
                                  if (p.get("properties_hash") or {}).get("condition") in EXP
                                  and (p.get("properties_hash") or {}).get("mtg_language") == "en"
                                  and bool((p.get("properties_hash") or {}).get("mtg_foil")) == foil)
                      r = cm.get(sid.get(bid))
                      trend = r and r[10 if foil else 6]
                      if trend and trend >= 500:   # carte da almeno 5 euro su Cardmarket
                          rows.append((names.get(bid), foil, trend, ex))
              print(f"\n== {code} ({e.get('name')}): {len(prods)} carte con offerte; condizioni {dict(conds)}; lingue top {langs.most_common(4)}; valute {dict(curr)}")
              with1 = [x for x in rows if len(x[3]) >= 1]; with3 = [x for x in rows if len(x[3]) >= 3]
              print(f"   carte >=5 euro su Cardmarket (normale+foil): {len(rows)}; con almeno 1 offerta EX+ in inglese: {len(with1)}; con almeno 3: {len(with3)}")
              ratios = [statistics.mean(x[3][:3]) / x[2] for x in with3]
              if ratios:
                  q = statistics.quantiles(ratios, n=4)
                  print(f"   media 3 offerte EX+ / tendenza Cardmarket: mediana {statistics.median(ratios):.2f}, 25% {q[0]:.2f}, 75% {q[2]:.2f}")
              for x in sorted(with3, key=lambda x: -x[2])[:5]:
                  print(f"   {x[0]}{' foil' if x[1] else ''}: tendenza CM {x[2]/100:.2f} | EX+ CT 3 piu' economiche {[c/100 for c in x[3][:3]]} | offerte EX+ {len(x[3])}")
