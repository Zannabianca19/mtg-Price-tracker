name: Archivio prezzi e sito

on:
  schedule:
    - cron: "23 16 * * *"   # 17:23 in Italia, 18:23 con l'ora legale: dopo il listino Cardmarket del giorno
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write   # per la copia mensile (Release) e il piccolo commit che tiene vivo l'aggiornamento
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install ijson

      - id: pages
        uses: actions/configure-pages@v6

      - name: Aggiorna l'archivio dei prezzi
        env:
          CARDTRADER_TOKEN: ${{ secrets.CARDTRADER_TOKEN }}
          PREV: ${{ steps.pages.outputs.base_url }}/data
        run: |
          B="mtg-price-tracker github/scripts/build.py"
          # Ogni gioco per conto suo: se l'aggiornamento di un gioco non riesce, si ripubblicano i suoi dati di ieri
          # e gli altri giochi vanno avanti. Magic è indispensabile: se mancano anche i dati di ieri, si ferma tutto.
          python "$B" --game mtg --out _site/data --prev "$PREV" || python "$B" --game mtg --restore --out _site/data --prev "$PREV"
          for g in op; do
            python "$B" --game $g --out _site/data --prev "$PREV" || python "$B" --game $g --restore --out _site/data --prev "$PREV" || echo "::warning::$g: nessun dato oggi"
          done

      - name: Copia il sito
        run: cp -r "mtg-price-tracker github/site/." _site/

      - name: Copia mensile permanente e attività nel repository
        if: github.ref == 'refs/heads/main'
        continue-on-error: true   # se fallisce, il sito si pubblica lo stesso
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="archivio-$(date -u +%Y-%m)"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Copia di $tag già presente."
            exit 0
          fi
          file="archivio-$(date -u +%Y-%m-%d).tar.gz"
          tar -czf "$file" -C _site data
          gh release create "$tag" "$file" --title "Archivio prezzi $(date -u +%Y-%m)" \
            --notes "Copia mensile automatica dell'archivio dei prezzi (cartella data/ del sito). Per ripristinarla: scompatta e pubblica la cartella data/."
          # GitHub sospende gli aggiornamenti programmati dei repository pubblici senza attività per 60 giorni:
          # un commit al mese lo evita. [skip ci] evita di far ripartire l'aggiornamento.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date -u +%Y-%m-%d > "mtg-price-tracker github/ultima-copia-mensile.txt"
          git add "mtg-price-tracker github/ultima-copia-mensile.txt"
          git commit -m "Copia mensile dell'archivio $tag [skip ci]"
          git push

      - name: Copia di sicurezza dei dati (14 giorni)
        uses: actions/upload-artifact@v7
        with:
          name: archivio-${{ github.run_number }}
          path: _site/data
          retention-days: 14

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
